# Workspace root for `vault-query`, the one crate left in this repo. The
# markdown core it builds on — `mdstruct` and `mdread` — moved to
# github.com/vadirn/md-for-agents and comes back as a git dependency. The
# manifest tracks `main`; `Cargo.lock` pins the commit, so `cargo update -p
# mdstruct -p mdread` is the whole bump.
#
# Shared dependencies are declared here and inherited with `.workspace = true`.
[workspace]
resolver = "3"
members = ["vault-query"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mdstruct = { git = "https://github.com/vadirn/md-for-agents.git", branch = "main" }
mdread = { git = "https://github.com/vadirn/md-for-agents.git", branch = "main" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
