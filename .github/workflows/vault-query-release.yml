name: vault-query musl release
on:
  push:
    tags: ["vault-query-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.91.1

jobs:
  musl:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-unknown-linux-musl
      - run: cargo +"$RUST_TOOLCHAIN" test --locked --target aarch64-unknown-linux-musl -p vault-query
      - run: cargo +"$RUST_TOOLCHAIN" build --locked --release --target aarch64-unknown-linux-musl -p vault-query
      - name: Verify architecture and static linkage
        run: |
          binary=target/aarch64-unknown-linux-musl/release/vault-query
          readelf -h "$binary" | grep -q 'Machine:.*AArch64'
          if readelf -l "$binary" | grep -q INTERP; then
            echo "vault-query needs a dynamic loader" >&2
            exit 1
          fi
      - name: Search the fixture vault in plain Alpine, as a Trinket box runs it
        run: |
          docker run --rm --platform linux/arm64 --network none \
            --user 65534:65534 -e HOME=/tmp \
            -v "$PWD/target/aarch64-unknown-linux-musl/release/vault-query:/usr/local/bin/vault-query:ro" \
            -v "$PWD/vault-query/tests/fixtures/vault:/workspace:ro" \
            alpine:3.22.6 vault-query --vault-root /workspace search retry \
            | grep -q 'Retry patterns'
      - name: Assemble pinned rootfs addition and binary checksums
        run: |
          mkdir -p rootfs/usr/local/bin dist
          cp target/aarch64-unknown-linux-musl/release/vault-query rootfs/usr/local/bin/vault-query
          chmod -R u=rwX,go=rX rootfs
          cp rootfs/usr/local/bin/vault-query dist/vault-query-aarch64-unknown-linux-musl
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -C rootfs -cf - . \
            | gzip -n > dist/vault-query-aarch64-unknown-linux-musl.tar.gz
          git rev-parse HEAD > dist/SOURCE_REVISION
          (cd dist && sha256sum vault-query-aarch64-unknown-linux-musl \
            vault-query-aarch64-unknown-linux-musl.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vault-query-musl
          path: dist
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vault-query-v')
    needs: musl
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vault-query-musl
          path: dist
      # Generated notes would list every config change in the repo, not just vault-query's.
      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Static aarch64-unknown-linux-musl build of vault-query at $(cat dist/SOURCE_REVISION)." \
            dist/*
